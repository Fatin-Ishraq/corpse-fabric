name: Bug report
description: Report a reproducible problem in the Fabric port
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is an unofficial Fabric review build. Please verify the problem without other inventory or death-handling mods when possible.
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.20.1
    validations:
      required: true
  - type: input
    id: fabric
    attributes:
      label: Fabric Loader and Fabric API versions
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the death dimension/location and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Install ...
        2. Die while carrying ...
        3. Open the corpse ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and configuration
      description: Attach logs/latest.log and config/corpse.json. Remove private server addresses or tokens first.
  - type: textarea
    id: mods
    attributes:
      label: Other installed mods
