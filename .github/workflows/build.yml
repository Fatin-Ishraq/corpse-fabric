name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up compatible Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ startsWith(github.ref_name, '26.') && '25' || startsWith(github.base_ref, '26.') && '25' || '21' }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build and run GameTests
        run: ./gradlew build
      - name: Upload remapped JAR
        uses: actions/upload-artifact@v7
        with:
          name: corpse-fabric-${{ github.ref_name }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
